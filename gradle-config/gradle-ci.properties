# CI preset for GitHub-hosted ubuntu-latest runners (4 vCPU / 16 GB). Selected only by an explicit
# `./apply.sh ci`; OS detection never picks it. The forked test JVMs get -Xmx4g each from the root
# build.gradle.kts on top of these two daemons, so keep the daemon heaps small and the worker count at 2.
kotlin.version=2.4.10
kotlin.code.style=official

org.gradle.jvmargs=-Xmx3g \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8 \
  -Djava.awt.headless=true \
  -Dkotlin.daemon.jvm.options="-Xmx3g,-Dkotlin.daemon.verbose=true"

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# Caps how many tasks run at once, and so how many Test tasks fork their -Xmx4g JVM at the same time. Heap
# ceilings: 3g daemon + 3g Kotlin daemon + workers.max x 4g. At 4 the three Test tasks (domain, infrastructure,
# application) could all fork together: 3 + 3 + 12 = 18g on a 16 GB runner. At 2: 3 + 3 + 8 = 14g, leaving about
# 2 GB for non-heap memory and the OS. Compilation loses little, because the modules compile in dependency
# order anyway. A 7 GB private-repository runner is overcommitted even at 1; lower the heaps there instead.
org.gradle.workers.max=2

org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.incremental=true
kotlin.build.report.output=file
kotlin.daemon.useFallbackStrategy=true

org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

org.gradle.console=verbose
org.gradle.warning.mode=all
