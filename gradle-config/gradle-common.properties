# Cross-platform fallback preset. Applied by `./apply.sh common`, and automatically when apply.sh
# cannot identify the host OS.
#
# Deliberately conservative: no GC selection, no experimental VM options, no OS-specific flags.
# The macOS and Linux presets exist precisely to carry those; anything here must be valid on every
# platform a JDK 25 build runs on. Keep the non-OS-specific keys below in sync with the other two
# presets — only memory, GC, and worker counts should ever differ between them.
kotlin.version=2.4.0
kotlin.code.style=official

# 4g heap suits an 8GB+ machine. No -XX:+UseZGC here: the JVM default collector is the portable
# choice, and this preset is the one that has to work on an OS we have not tuned for.
org.gradle.jvmargs=-Xmx4g \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8 \
  -Djava.awt.headless=true \
  -Dkotlin.daemon.jvm.options="-Xmx2g,-Dkotlin.daemon.verbose=true"

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# Left unset on purpose — Gradle defaults to the host's processor count, which is the right
# answer on hardware we know nothing about. The Linux preset pins 16 for server builds.
# org.gradle.workers.max=

org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.incremental=true
kotlin.build.report.output=file
# Unlike the macOS/Linux presets this leaves the Kotlin daemon fallback enabled: if the daemon
# cannot start on an untuned platform, the build should degrade to in-process compilation rather
# than fail outright.
kotlin.daemon.useFallbackStrategy=true

org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

org.gradle.console=verbose
org.gradle.warning.mode=all
