# [[allowlists]] needs gitleaks 8.25.0 or newer; security_check.yaml pins GITLEAKS_VERSION accordingly.
[extend]
useDefault = true

[[allowlists]]
description = "Sample MariaDB manifest for the CDC stack ships SCREAMING_SNAKE placeholder Secret values that the kubernetes-secret-yaml rule reports as leaks"
paths = ['''application/src/main/resources/cdc/k8s/yamls/mariadb/mariadb-config\.yaml''']
