spring:
  config:
    activate:
      on-profile: "dev"

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER_NAME}
    password: ${DATABASE_USER_PWD}

    hikari:
      transaction-isolation: TRANSACTION_REPEATABLE_READ
      maximum-pool-size: 20
      #      minimum-idle: 10
      connection-timeout: 5000
      validation-timeout: 3000
      connection-test-query: SELECT 1
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: hikari_pool


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 1000
  h2:
    console:
      enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: codeCompanion
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false # container commits per record (AckMode.RECORD); see application-prod.yaml
      max-poll-records: 5
      properties:
        max.poll.interval.ms: 300000

server:
  port: 9000
  servlet:
    session:
      timeout: 5000

logging:
  level:
    org.springframework.transaction: debug
    org.hibernate.sql: debug

management:
  endpoint:
    logfile:
      external-file: ~/logback.log
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        # dev is reachable over HTTP without authentication: no heapdump, loggers (writable), threaddump.
        include: health,info,metrics,prometheus
      base-path: /api/actuator
      path-mapping:
        loggers: logs
        httptrace: trace
  info:
    build:
      enabled: true
    env:
      enabled: true

info:
  app:
    name: Code Companion-dev
    version: ${VERSION:unknown}
    build-date: ${BUILD_DATE:unknown}
    git-ref: ${GIT_REF:unknown}
    build-number: ${BUILD_NUMBER:unknown}

slack:
  app:
    api:
      token: ${SLACK_API_TOKEN}
      # No default: dev is reachable over HTTP, so a missing secret must fail startup, not silently
      # disable signature verification (the filter skips verification when the secret is blank).
      signing-secret: ${SLACK_SIGNING_SECRET}
    mode:
      outbox-reading-strategy: cdc
      event-publisher: kafka
      cdc:
        topic: cdc.code_companion.outbox_message
    # Google Calendar per-user OAuth (/calendar connect). Off unless GOOGLE_CALENDAR_ENABLED=true;
    # then the client id/secret, the public callback URL and a base64 32-byte token key are required.
    calendar:
      google:
        enabled: ${GOOGLE_CALENDAR_ENABLED:false}
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
        token-encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:}
