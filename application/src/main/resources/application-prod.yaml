spring:
  config:
    activate:
      on-profile: "prod"

  lifecycle:
    timeout-per-shutdown-phase: 10s

  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      transaction-isolation: ${SQL_PROD_ISOLATION_LEVEL}
      maximum-pool-size: 10
#      minimum-idle: 10
      connection-timeout: ${SQL_PROD_CONNECTION_TIMEOUT}
      validation-timeout: ${SQL_PROD_VALIDATION_TIMEOUT}
      connection-test-query: SELECT 1
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: hikari_pool

    driver-class-name: org.mariadb.jdbc.Driver
    url: ${SQL_DATABASE_URL}
    username: ${SQL_DATABASE_USERNAME}
    password: ${SQL_DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_SIZE}
    generate-ddl: false
  h2:
    console:
      enabled: false

  # MCP server for the agent lane's domain tools. `MCP_ENABLED` drives both this switch and
  # `slack.app.mcp.enabled` so the transport and the token pipeline cannot diverge.
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        name: codecompanion
        version: ${VERSION:unknown}
        type: SYNC
        protocol: STREAMABLE
        instructions: "Read-only CodeCompanion domain tools; caller identity comes from the per-turn token."
        capabilities:
          tool: true
        streamable-http:
          mcp-endpoint: /mcp
          disallow-delete: true

  kafka:
    bootstrap-servers: [ "kafka:port" ]
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: codeCompanion
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      max-poll-records: 1000
      isolation-level: read_committed

server:
  port: 80
  servlet:
    session:
      timeout: 5000
  shutdown: graceful

management:
  endpoint:
    logfile:
      external-file: ./logback.log
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: ${ACTUATOR_BASE_PATH}
      path-mapping:
        loggers: logs
        httptrace: trace
  info:
    build:
      enabled: true
    env:
      enabled: true

info:
  app:
    name: Code Companion
    version: ${VERSION:unknown}
    build-date: ${BUILD_DATE:unknown}
    git-ref: ${GIT_REF:unknown}
    build-number: ${BUILD_NUMBER:unknown}

slack:
  app:
    api:
      token: ${SLACK_API_TOKEN}
      signing-secret: ${SLACK_SIGNING_SECRET}
      request-timestamp-tolerance-seconds: 300
    mode:
      outbox-reading-strategy: cdc
      event-publisher: kafka
      cdc:
        topic: ${SLACK_CDC_TOPIC}
    # AI agent backend — the claude-sidecar runs in the same Pod (k8s native sidecar), so the
    # base URL stays Pod-loopback. The bearer secret is shared with the sidecar via one Secret.
    agent:
      sidecar:
        base-url: ${SIDECAR_URL:http://127.0.0.1:7300}
        bearer-secret: ${SIDECAR_BEARER_SECRET:}
        request-timeout-seconds: ${SIDECAR_REQUEST_TIMEOUT_SECONDS:120}
    # CVE summary provider. Operating choice is sidecar (reuse the agent lane), but the default
    # stays noop so summary traffic is opt-in via AI_PROVIDER once the collector rolls out.
    ai:
      provider: ${AI_PROVIDER:noop}
    # CVE feed collector sources. Tokens/keys default empty (anonymous, rate-limited) and are never
    # logged; the collector only runs when slack.app.cve.enabled is true.
    cve:
      github:
        token: ${GITHUB_TOKEN:}
        per-page: ${GITHUB_RELEASES_PER_PAGE:10}
      nvd:
        api-key: ${NVD_API_KEY:}
        lookback-minutes: ${NVD_LOOKBACK_MINUTES:120}
      collector:
        request-timeout-seconds: ${CVE_COLLECTOR_REQUEST_TIMEOUT_SECONDS:30}
        window-minutes: ${CVE_COLLECTOR_WINDOW_MINUTES:5}
    mcp:
      enabled: ${MCP_ENABLED:false}
      signing-secret: ${MCP_SIGNING_SECRET:}
