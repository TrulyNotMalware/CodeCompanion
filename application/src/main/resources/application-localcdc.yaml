# Local E2E profile: points the app at the orbstack infra (~/infra) for verifying the
# outbox -> Debezium CDC -> Kafka -> consumer pipeline end to end. The Slack token is a dummy,
# so the final chat.postMessage call fails harmlessly (no real workspace delivery) while every
# step before it is exercised against real MariaDB + Kafka + Debezium.
#
# Flyway is disabled and ddl-auto=update creates the full schema (the V* migrations are
# incremental patches that assume Hibernate already created the base tables, so on a fresh DB
# only ddl-auto can stand the schema up). This still validates the MeetingReminderSchema JPA
# mapping against real MariaDB.
spring:
  config:
    activate:
      on-profile: "localcdc"

  threads:
    virtual:
      enabled: true

  flyway:
    enabled: false

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/code_companion
    username: root
    password: root_password
    hikari:
      transaction-isolation: TRANSACTION_REPEATABLE_READ
      maximum-pool-size: 10
      connection-timeout: 5000
      pool-name: hikari_pool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 1000

  kafka:
    bootstrap-servers:
      - "localhost:19092"
      - "localhost:29092"
      - "localhost:39092"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: codeCompanion-localcdc
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      max-poll-records: 1000

server:
  port: 9000

logging:
  level:
    dev.notypie: debug

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /api/actuator

slack:
  app:
    api:
      token: "xoxb-dummy-localcdc-token"
    mode:
      stand-alone: true
      outbox-reading-strategy: cdc
      event-publisher: kafka
      cdc:
        topic: cdc.code_companion.outbox_message
