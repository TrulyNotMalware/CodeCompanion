# Real-workspace test profile. Simplest path to exercise the bot against a real Slack app:
#   POLLING outbox relay + APPLICATION_EVENT publisher  → no Kafka / no Debezium required.
# The app polls the outbox table and dispatches to Slack directly.
#
# Run:
#   SLACK_API_TOKEN=xoxb-... SLACK_SIGNING_SECRET=... \
#     ./gradlew :application:bootRun --args='--spring.profiles.active=real'
#
# DB defaults to the local orbstack MariaDB (`code_companion`). ddl-auto=update stands the schema
# up (the V* migrations are incremental patches; Flyway is disabled here, same rationale as the
# local profile). Expose :9000 with a tunnel (ngrok/cloudflared) and point the Slack app's
# slash / interactivity / event request URLs at it — see RealTestSetup.md.
spring:
  config:
    activate:
      on-profile: "real"

  threads:
    virtual:
      enabled: true

  flyway:
    enabled: false

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DATABASE_URL:jdbc:mariadb://localhost:3306/code_companion}
    username: ${DATABASE_USER_NAME:root}
    password: ${DATABASE_USER_PWD:root_password}
    hikari:
      transaction-isolation: TRANSACTION_REPEATABLE_READ
      maximum-pool-size: 10
      connection-timeout: 5000
      keepalive-time: 30000
      max-lifetime: 600000
      pool-name: hikari_pool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 1000

server:
  port: 9000

logging:
  level:
    dev.notypie: debug

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /api/actuator

slack:
  app:
    api:
      token: ${SLACK_API_TOKEN}
      # Leave blank to disable request-signature verification (local testing only). Set the real
      # signing secret to enforce Slack's X-Slack-Signature check (SlackRequestVerificationFilter).
      signing-secret: ${SLACK_SIGNING_SECRET:}
    mode:
      stand-alone: true
      # POLLING + APPLICATION_EVENT keeps the whole relay in-process — no Kafka, no Debezium.
      outbox-reading-strategy: polling
      event-publisher: application_event
