apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-companion-deploy
spec:
  replicas: 2 # Change replicas
  # Recreate for the release that introduced the outbox claim token (V20/V22): it must never run beside a
  # pre-V20 Pod, which re-dispatches IN_PROGRESS rows it does not own and overwrites outbox status without the
  # attempt guard. A rolling update would overlap old and new Pods during the rollout, and again during the
  # workflow's `rollout undo`. Recreate stops every old Pod before the first new one starts, and an undo keeps
  # it because the strategy is not part of the pod template.
  # Cost: while this block is here, every deploy (rollbacks included) is an outage until a new Pod is Ready,
  # up to the startup probe's 3 minutes.
  # Remove the whole block in a follow-up PR once every Pod runs a V20+ binary and a rollback to a pre-V20
  # revision is no longer wanted: `kubectl apply`'s three-way merge deletes the field (it is in the
  # last-applied configuration) and the API server defaults it back to RollingUpdate (25% / 25%).
  # `rollingUpdate: null` clears the defaulted rollingUpdate block of the live object; the API server rejects
  # a rollingUpdate next to `type: Recreate`.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: code-companion-deploy
  template:
    metadata:
      labels:
        app: code-companion-deploy
    spec:
      # The close waits in series: preStop 5s + the Kafka listener phase 60s (timeout-per-shutdown-phase, one CDC record
      # in flight) + relayTaskExecutor's destroy-time wait 60s (dispatches already running; queued ones are dropped) +
      # the @Async executor's 10s + 15s margin = 150s. The web-graceful and scheduler phases sit between the Kafka phase
      # and the executor waits; each normally takes seconds, and at its 60s cap it runs after every dispatch started
      # before the close has had its one-record budget. ShutdownBudgetTest checks this sum.
      terminationGracePeriodSeconds: 150
      imagePullSecrets:
        - name: dockercred
      containers:
        - name: code-companion-deploy
          image: $IMAGE_NAME
          ports:
            - containerPort: 80
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          # Keeps serving while endpoint removal propagates to kube-proxy and the gateway before SIGTERM.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # Liveness/readiness groups come from management.endpoint.health.probes.enabled in application-prod.yaml.
          # Without readiness the Service keeps routing to Pods that are still booting or already draining.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 80
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 80
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 80
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: tz-seoul
              mountPath: /etc/localtime
          envFrom:
            - secretRef:
                name: code-companion-secret
            - configMapRef:
                name: code-companion-configmap
      volumes:
        - name: tz-seoul
          hostPath:
            path: /usr/share/zoneinfo/Asia/Seoul
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: code-companion-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: code-companion-deploy
