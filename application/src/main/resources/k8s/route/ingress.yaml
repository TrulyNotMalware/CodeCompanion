apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-companion-ingress
  labels:
    app: code-companion-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: 'your-cluster-issuer'
spec:
  tls:
    - hosts:
        - your.uri
      secretName: your-secret-tls
  rules:
    - host: your.uri
      http:
        paths:
          # Slack endpoints and the Google OAuth callback only. Not /api: dev/local/slack-live serve the unauthenticated
          # actuator at /api/actuator.
          - pathType: Prefix
            path: /api/slack
            backend:
              service:
                name: code-companion-svc
                port:
                  number: 80
          - pathType: Prefix
            path: /api/slash
            backend:
              service:
                name: code-companion-svc
                port:
                  number: 80
          - pathType: Exact
            path: /oauth/google/callback
            backend:
              service:
                name: code-companion-svc
                port:
                  number: 80