apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: code-companion-http-route
  namespace: your-namespace
spec:
  parentRefs:
    - name: api-gateway-name
      namespace: gateway-vendor-namespace
      sectionName: gateway-section-name
  hostnames:
    - your.uri
  rules:
    # Slack endpoints only. Not /api: dev/local/slack-live serve the unauthenticated actuator at /api/actuator.
    - matches:
        - path:
            type: PathPrefix
            value: /api/slack
        - path:
            type: PathPrefix
            value: /api/slash
      backendRefs:
        - name: code-companion-svc
          port: 80
