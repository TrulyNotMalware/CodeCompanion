# Base defaults applied to every profile. Kept minimal on purpose — profile yamls own their
# environment; only cross-profile safety defaults belong here.
spring:
  lifecycle:
    # Each shutdown phase must outwait one CDC record in flight (CDC_LISTENER_SHUTDOWN_TIMEOUT, 60 s): the listener
    # container finishes the record in hand and records its status before the DataSource closes; cut shorter,
    # another pod's sweep re-sends a message that was already posted. k8s/deployment.yaml's grace period is sized
    # on top of this; ShutdownBudgetTest checks every profile and the manifest.
    timeout-per-shutdown-phase: 60s
  jpa:
    # Explicitly off (Boot defaults to true and warns at startup). With it on, every HTTP request binds one
    # EntityManager for its whole duration, so the meeting write MeetingWriteDeferral runs after the interaction
    # transaction commits would open its first attempt on the interaction's persistence context and answer from
    # entities that transaction loaded, with no version check on a no-write outcome. Nothing depends on lazy
    # loading outside a transaction: every LAZY association is fetch-joined by its read query or touched inside a
    # @Transactional repository method, and only DTOs leave the repositories. MeetingWriteJpaTransactionTest pins
    # both the setting in every profile and what the deferred write sees with and without it.
    open-in-view: false
  ai:
    mcp:
      server:
        # The MCP starter auto-configures an open /mcp endpoint when left at its default (true).
        # Off everywhere unless a profile opts in (prod does via MCP_ENABLED).
        enabled: false
  task:
    scheduling:
      pool:
        # Read by the explicit `taskScheduler` ThreadPoolTaskScheduler in SchedulingConfig. Without that
        # bean, spring.threads.virtual.enabled makes Boot pick a SimpleAsyncTaskScheduler that ignores
        # this value and runs every fixed-delay job on one thread, so one slow job (the CVE workers'
        # outbound HTTP, a recovery sweep) starves all the others. SchedulingWiringSmokeTest pins both.
        size: 4

slack:
  app:
    mcp:
      enabled: false

server:
  # Never derive the client address from X-Forwarded-*. Boot enables forward headers by itself when it
  # detects Kubernetes (KUBERNETES_SERVICE_HOST/PORT), and Jetty would then set remoteAddr from a
  # client-supplied X-Forwarded-For — any pod could pass McpTurnTokenFilter's loopback check by sending
  # `X-Forwarded-For: 127.0.0.1`. Nothing in the app builds URLs or decisions from forwarded headers.
  forward-headers-strategy: none
