# Base defaults applied to every profile. Kept minimal on purpose — profile yamls own their
# environment; only cross-profile safety defaults belong here.
spring:
  ai:
    mcp:
      server:
        # The MCP starter auto-configures an open /mcp endpoint when left at its default (true).
        # Off everywhere unless a profile opts in (prod does via MCP_ENABLED).
        enabled: false
  task:
    scheduling:
      pool:
        # Spring's default scheduler pool is a single thread shared by every @Scheduled job; one
        # slow job (e.g. the CVE collector's outbound HTTP) would starve all the others.
        size: 4

slack:
  app:
    mcp:
      enabled: false

server:
  # Never derive the client address from X-Forwarded-*. Boot enables forward headers by itself when it
  # detects Kubernetes (KUBERNETES_SERVICE_HOST/PORT), and Jetty would then set remoteAddr from a
  # client-supplied X-Forwarded-For — any pod could pass McpTurnTokenFilter's loopback check by sending
  # `X-Forwarded-For: 127.0.0.1`. Nothing in the app builds URLs or decisions from forwarded headers.
  forward-headers-strategy: none
