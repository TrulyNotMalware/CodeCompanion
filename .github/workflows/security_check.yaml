name: Security Check
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Mondays 09:00 KST. Re-runs CodeQL against the latest query packs even when nothing was pushed.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists PR files through the REST API, which needs this scope.
      pull-requests: read
    outputs:
      # Scheduled and manual runs have no diff to filter on, so they analyse everything.
      source: ${{ (github.event_name != 'push' && github.event_name != 'pull_request') || steps.filter.outputs.source == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          # 'some-with-excludes' is what makes '!**/*.md' effective; under the default 'some'
          # quantifier a negated pattern is a no-op (see deploy_action.yaml). It requires v4.
          predicate-quantifier: some-with-excludes
          filters: |
            source:
              - "application/**"
              - "domain/**"
              - "infrastructure/**"
              - "*.gradle.kts"
              - "gradle/**"
              - "gradle-config/**"
              - "!**/*.md"

  codeql:
    name: CodeQL (java-kotlin)
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # build-mode 'none' analyses Java only and silently skips Kotlin sources, and this
          # project is pure Kotlin, so a real compile has to run between init and analyze.
          build-mode: manual

      - name: Compile sources for CodeQL
        # CodeQL only extracts code compiled by a JVM its tracer started: --no-daemon forces a
        # fresh traced build JVM and --no-build-cache prevents compiled classes being served
        # from the cache restored by setup-java instead of being compiled.
        run: ./gradlew classes --no-daemon --no-build-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.workers.max=4"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  dependency-graph:
    name: Dependency graph & review
    needs: changes
    # The graph only changes with commits, so the weekly schedule has nothing to submit. PRs from
    # forks are skipped: their token can never hold the contents: write that submission needs.
    if: >-
      needs.changes.outputs.source == 'true'
      && github.event_name != 'schedule'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # GitHub cannot read Gradle build scripts by itself; this submission is what populates the
      # dependency graph that Dependabot alerts and the review step below both rely on.
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-submit

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Push and PR runs scan only the new commits; scheduled runs scan the full history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organization-owned repositories.
