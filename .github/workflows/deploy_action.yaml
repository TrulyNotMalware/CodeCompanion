name: Deploy Production Server
on:
  pull_request:
    types:
      - closed
    branches:
      - "main"
    paths:
      - "application/**"
      - "domain/**"
      - "infrastructure/**"
      - "*.gradle.kts"
      - "gradle/**"
      # Documentation-only merges must never reach production. GitHub evaluates negative patterns
      # after the positive ones above, so a PR whose entire diff is markdown (AGENTS.md, the k8s
      # and cdc READMEs) matches nothing and the workflow never starts. Every doc file under the
      # watched paths is .md; banner.txt is a runtime asset and Dockerfile is build input, so
      # neither is excluded here.
      - "!**/*.md"

permissions:
  contents: read
  deployments: write

# An explicit bash runs `bash --noprofile --norc -eo pipefail {0}`; the implicit default `bash -e {0}` lets a failing
# jq in `jq … | sha256sum | cut` hash empty input, so the rollback's change check could read "unchanged".
defaults:
  run:
    shell: bash

# Serialise production deploys: overlapping runs would interleave backup, apply and rollback.
# An unmerged close gets its own group, or it would replace a merge's pending run in the deploy queue.
concurrency:
  group: ${{ github.event.pull_request.merged && 'deploy-production' || format('deploy-skip-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  ENVIRONMENT_URL: https://api.notypie.dev

  K8S_NAMESPACE: api-service
  K8S_DEPLOYMENT_NAME: code-companion-deploy
  K8S_SERVICE_NAME: code-companion-svc
  K8S_CONTAINER_NAME: code-companion-deploy
  DEPLOYMENT_ROLLOUT_TIMEOUT: 300s

  JAR_FILE_NAME: code-companion-prod
  STATIC_DOCKER_TAG: ${{ github.sha }}
  REGISTRY: harbor.registry.notypie.dev
  IMAGE_NAME: bot/code-companion

jobs:
  check-changes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # dorny/paths-filter lists the merged PR's files through the API on pull_request events and
    # fails without this scope; granted here only so the build/deploy jobs do not inherit it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-deploy: ${{ steps.determine.outputs.should-deploy }}
      modules-changed: ${{ steps.determine.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          # No '!' patterns here on purpose. With the default predicate-quantifier ('some') a
          # negated pattern is a no-op, and 'every' would break the two-pattern gradle filter
          # below; 'some-with-excludes' would do what we want but is not needed: the
          # workflow-level `paths:` gate above already guarantees this job only runs when a
          # non-markdown file changed, so should-deploy cannot be true for a docs-only merge.
          filters: |
            app:
              - 'application/**'
            domain:
              - 'domain/**'
            infra:
              - 'infrastructure/**'
            gradle:
              - '*.gradle.kts'
              - 'gradle/**'

      - name: Determine deployment
        id: determine
        run: |
          if [[ "${{ steps.changes.outputs.app }}" == "true" || "${{ steps.changes.outputs.domain }}" == "true" || "${{ steps.changes.outputs.infra }}" == "true" || "${{ steps.changes.outputs.gradle }}" == "true" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "modules=app:${{ steps.changes.outputs.app }},domain:${{ steps.changes.outputs.domain }},infra:${{ steps.changes.outputs.infra }}" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Create deployment
        uses: actions/github-script@v9
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Production deployment',
              auto_merge: false,
              required_contexts: []
            });
            return deployment.data.id;

      - name: Set deployment status to in progress
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'in_progress',
              description: 'Building application...'
            });

      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Apply Gradle configuration for CI
        run: |
          chmod +x gradle-config/apply.sh
          ./gradle-config/apply.sh ci

      # Full `build` (every module's tests + ktlintCheck) on purpose: this is the artifact that
      # reaches production, and a PR can be merged with the required checks still pending, so the
      # deploy build is the last gate. `:application:build` alone would skip the domain and
      # infrastructure suites.
      - name: Build application
        run: ./gradlew build -PjarName=${{ env.JAR_FILE_NAME }} --parallel

      # Support ARM. in my case, I'm using Oracle Cloud Infrastructure with Arm64 instances
      ######################################################
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      ######################################################
      - name: Login to Harbor registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ env.STATIC_DOCKER_TAG }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./application
          platforms: linux/amd64,linux/arm64 # Support ARM
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAR_FILE_NAME=${{ env.JAR_FILE_NAME }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ env.STATIC_DOCKER_TAG }}
            GIT_REF=${{ github.ref_name }}
            BUILD_NUMBER=${{ github.run_number }}
          provenance: false
          sbom: false

      - name: Update deployment status on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Build failed'
            });
    outputs:
      deployment-id: ${{ steps.deployment.outputs.result }}
      image_tag: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: [ check-changes, build ]
    if: needs.check-changes.outputs.should-deploy == 'true' && success()
    runs-on: ubuntu-latest
    # Rollout (300s) + health check (~2 min) + rollback rollout (300s) must fit.
    timeout-minutes: 20
    name: Deploy to Production OKE
    env:
      DEPLOYMENT_ID: ${{ needs.build.outputs.deployment-id }}

      # Job-wide, not step-scoped: the kubeconfig written by configure-kubectl-oke runs
      # `oci ce cluster generate-token` on every kubectl call, which reads these variables.
      OCI_CLI_USER: ${{ secrets.PROD_OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.PROD_OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.PROD_OCI_CLI_FINGERPRINT }}

      OCI_CLI_KEY_CONTENT: ${{ secrets.PROD_OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.PROD_OCI_CLI_REGION }}

    steps:
      - uses: actions/checkout@v7
      - name: Configure Kubectl
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        id: configure-kubectl-oke-action
        with:
          cluster: ${{ secrets.PROD_OKE_CLUSTER_OCID }}

      # A lookup error other than NotFound fails here, before anything is applied, rather than recording
      # "no previous deployment" and disabling the rollback.
      - name: Backup current deployment
        id: backup
        run: |
          err_file=$(mktemp)
          if current=$(kubectl get deployment ${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} -o json 2> "$err_file"); then
            PREVIOUS_REVISION=$(jq -r '.metadata.annotations["deployment.kubernetes.io/revision"] // "none"' <<< "$current")
            PREVIOUS_TEMPLATE=$(jq -cS '.spec.template' <<< "$current" | sha256sum | cut -d' ' -f1)
            PREVIOUS_IMAGE=$(jq -r '.spec.template.spec.containers[0].image // "none"' <<< "$current")
          elif grep -q 'NotFound' "$err_file"; then
            PREVIOUS_REVISION=none
            PREVIOUS_TEMPLATE=none
            PREVIOUS_IMAGE=none
          else
            echo "::error::Could not read the current Deployment: $(cat "$err_file")"
            exit 1
          fi
          echo "previous-revision=$PREVIOUS_REVISION" >> $GITHUB_OUTPUT
          echo "previous-template=$PREVIOUS_TEMPLATE" >> $GITHUB_OUTPUT
          echo "previous-image=$PREVIOUS_IMAGE" >> $GITHUB_OUTPUT
          echo "Previous revision: $PREVIOUS_REVISION, template sha256: $PREVIOUS_TEMPLATE, image: $PREVIOUS_IMAGE"

      - name: Apply kubernetes manifests
        id: apply
        run: |
          export IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.STATIC_DOCKER_TAG }}"
          # Only $IMAGE_NAME is substituted; the job env holds the OCI private key.
          envsubst '${IMAGE_NAME}' < application/src/main/resources/k8s/deployment.yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -

      - name: Wait for deployment rollout
        id: rollout
        run: |
          kubectl rollout status deployment ${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} --timeout=${{ env.DEPLOYMENT_ROLLOUT_TIMEOUT }}

      - name: Verify deployment health
        id: verify
        run: |
          # Count Ready pods, not Running ones: a pod that is still booting (or crash-looping
          # after a failed context load) is Running but never becomes Ready.
          READY_PODS=$(kubectl get pods -l app=${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{range .items[*]}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}' | grep -c '^True$' || true)
          DESIRED_REPLICAS=$(kubectl get deployment ${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.spec.replicas}')
          echo "Ready pods: $READY_PODS, Desired: $DESIRED_REPLICAS"

          # -lt, not -ne: a terminating pod from the previous ReplicaSet can still count as Ready for a moment.
          if [ "$READY_PODS" -lt "$DESIRED_REPLICAS" ]; then
            echo "Deployment verification failed."
            exit 1
          fi

          echo "Deployment success!"

      # In-cluster only: the public host sits behind an edge that is not part of this repository.
      # Readiness, not the aggregate: OutboxHealthIndicator can be DOWN for reasons unrelated to the release.
      # The service proxy needs `get` on services/proxy and the API server reaching pod IPs; exec needs pods/exec.
      - name: Run Health check
        id: health
        run: |
          if ! command -v jq > /dev/null; then
            echo "::error::jq is not installed on this runner; cannot parse the health response."
            exit 1
          fi
          proxy_base="/api/v1/namespaces/${{ env.K8S_NAMESPACE }}/services/${{ env.K8S_SERVICE_NAME }}:80/proxy"
          err_file=$(mktemp)

          # Sets $method and $body on success; logs each method's error otherwise. stderr stays out of $body
          # so a kubectl warning cannot break the JSON parse.
          fetch() {
            if body=$(kubectl get --raw "${proxy_base}$1" --request-timeout=10s 2> "$err_file"); then
              method="service proxy"
              return 0
            fi
            echo "  service proxy failed: $(cat "$err_file")"
            if body=$(kubectl exec "deploy/${{ env.K8S_DEPLOYMENT_NAME }}" -n ${{ env.K8S_NAMESPACE }} -c ${{ env.K8S_CONTAINER_NAME }} --request-timeout=20s -- wget -qO- -T 10 "http://localhost:80$1" 2> "$err_file"); then
              method="pod exec"
              return 0
            fi
            echo "  pod exec failed: $(cat "$err_file")"
            return 1
          }

          deadline=$((SECONDS + 120))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt: GET /actuator/health/readiness"
            if fetch /actuator/health/readiness; then
              if jq -e '.status == "UP"' > /dev/null 2>&1 <<< "$body"; then
                echo "Readiness UP via $method: $body"
                echo "Aggregate /actuator/health (informational, does not gate the deploy):"
                if fetch /actuator/health; then
                  echo "  via $method: $body"
                else
                  echo "  aggregate not UP or unreachable (HTTP 503 hides the body); ignored."
                fi
                exit 0
              fi
              echo "  readiness via $method is not UP: $body"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            sleep 5
          done

          echo "::error::Readiness was not UP after $attempt attempts (120s)."
          exit 1

      - name: Update deployment status to success
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ env.DEPLOYMENT_ID }},
              state: 'success',
              environment_url: '${{ env.ENVIRONMENT_URL }}',
              description: 'Deployment completed successfully'
            });

      # `rollout undo` restores the whole previous pod template (image, probes, resources), not just the image.
      # "Changed" compares the pod template itself: the revision annotation is written later by the controller.
      # An unreadable Deployment still gets the undo; kubectl skips it when the template already matches.
      - name: Rollback on failure
        id: rollback
        if: failure() && (steps.apply.outcome == 'failure' || steps.rollout.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          PREVIOUS_REVISION="${{ steps.backup.outputs.previous-revision }}"
          PREVIOUS_TEMPLATE="${{ steps.backup.outputs.previous-template }}"

          if [ -z "$PREVIOUS_REVISION" ] || [ "$PREVIOUS_REVISION" = "none" ]; then
            echo "No previous revision recorded (first deploy); nothing to roll back."
            echo "result=not rolled back" >> $GITHUB_OUTPUT
            exit 0
          fi

          err_file=$(mktemp)
          current=""
          for lookup in 1 2 3; do
            if current=$(kubectl get deployment ${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} -o json 2> "$err_file"); then
              break
            fi
            current=""
            echo "Deployment lookup $lookup/3 failed: $(cat "$err_file")"
            sleep 5
          done

          if [ -z "$current" ]; then
            echo "::error::Could not read the Deployment; undoing to revision $PREVIOUS_REVISION without a change check."
          else
            CURRENT_REVISION=$(jq -r '.metadata.annotations["deployment.kubernetes.io/revision"] // ""' <<< "$current")
            CURRENT_TEMPLATE=$(jq -cS '.spec.template' <<< "$current" | sha256sum | cut -d' ' -f1)
            echo "Revision $PREVIOUS_REVISION -> ${CURRENT_REVISION:-unknown}, template $PREVIOUS_TEMPLATE -> $CURRENT_TEMPLATE"
            if [ "$CURRENT_TEMPLATE" = "$PREVIOUS_TEMPLATE" ] && [ "$CURRENT_REVISION" = "$PREVIOUS_REVISION" ]; then
              echo "This run left the pod template unchanged; nothing to roll back."
              echo "result=not rolled back" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "result=rollback failed" >> $GITHUB_OUTPUT
          kubectl rollout undo deployment/${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} --to-revision="$PREVIOUS_REVISION"
          kubectl rollout status deployment ${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} --timeout=${{ env.DEPLOYMENT_ROLLOUT_TIMEOUT }}
          echo "Rolled back to the template of revision $PREVIOUS_REVISION (image: ${{ steps.backup.outputs.previous-image }})."
          echo "result=rolled back" >> $GITHUB_OUTPUT

      - name: Update deployment status on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ env.DEPLOYMENT_ID }},
              state: 'failure',
              description: 'Deployment failed - ${{ steps.rollback.outputs.result || 'rollback not attempted' }}'
            });
