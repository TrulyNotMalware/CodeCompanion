name: Run tests
on:
  push:
    branches:
      - "feature/*"
      - "feat/*"
      - "features/*"
      - "dependabot/**"
    paths:
      - "application/**"
      - "domain/**"
      - "infrastructure/**"
      - "*.gradle.kts"
      - "gradle/**"
      # No test covers markdown; a docs-only push should not start a build.
      - "!**/*.md"
  # Every PR into main runs the tests regardless of the source branch name; the push trigger above
  # only covers feature-style prefixes, so hotfix/, chore/, refactor/ branches used to reach main
  # without a single test run. No `paths` filter here on purpose: a branch-protection required check
  # that never triggers (docs-only PR) stays pending forever and blocks the merge; the paths-filter
  # step below still selects zero modules for such a PR, so the job finishes in seconds.
  pull_request:
    branches:
      - "main"
permissions:
  contents: read
  # dorny/paths-filter lists the PR's files through the API on pull_request events and fails the
  # step without this scope (on push events it diffs locally and does not need it).
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            application:
              - 'application/**'
            domain:
              - 'domain/**'
            infrastructure:
              - 'infrastructure/**'
            gradle:
              - 'gradle/**'
              - '*.gradle.kts'
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply Gradle configuration for CI
        run: |
          chmod +x gradle-config/apply.sh
          ./gradle-config/apply.sh

      # Dependencies flow application -> infrastructure -> domain, so a change must also run the
      # tests of every module that depends on it: a domain contract change is only caught by the
      # infrastructure/application suites that consume it.
      - name: Collect test modules
        id: collect
        run: |
          if [ "${{ steps.changes.outputs.gradle }}" == "true" ] || [ "${{ steps.changes.outputs.domain }}" == "true" ]; then
            echo "modules=test" >> $GITHUB_OUTPUT
          elif [ "${{ steps.changes.outputs.infrastructure }}" == "true" ]; then
            echo "modules=:infrastructure:test :application:test" >> $GITHUB_OUTPUT
          elif [ "${{ steps.changes.outputs.application }}" == "true" ]; then
            echo "modules=:application:test" >> $GITHUB_OUTPUT
          else
            echo "modules=" >> $GITHUB_OUTPUT
          fi

      - name: Run selected tests
        if: steps.collect.outputs.modules != ''
        run: ./gradlew ${{ steps.collect.outputs.modules }}

      - name: Bundle the build report
        if: failure()
        run: find . -type d -name 'reports' | zip -@ -r build-reports.zip

      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: error-report
          path: build-reports.zip
