name: Lint Check
on:
  push:
    branches: ["feature/*", "feat/*", "features/*", "dependabot/**"]
    # ktlint has nothing to say about markdown, so docs-only pushes should not burn a CI run.
    paths:
      ["application/**", "domain/**", "infrastructure/**", "*.gradle.kts", "!**/*.md"]
  # Every PR into main gets linted regardless of the source branch name; the push trigger above
  # only covers feature-style prefixes, so hotfix/, chore/, refactor/ branches used to reach main
  # without a single ktlint run. No `paths` filter here on purpose: a branch-protection required
  # check that never triggers (docs-only PR) stays pending forever and blocks the merge.
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint check
        run: ./gradlew ktlintCheck
