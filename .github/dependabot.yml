version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      # Repository convention is "<type> : <subject>" (see .gitmessage). Ending the prefix with
      # the colon stops Dependabot from appending its own.
      prefix: "chore :"
    groups:
      # The Kotlin compiler and its spring/jpa plugins must move in lockstep. Group patterns match the
      # dependency name Dependabot parses, and for the `kotlin("jvm")` plugin shorthand that name is the
      # bare argument (`jvm`, `plugin.spring`, `plugin.jpa`), not `org.jetbrains.kotlin.jvm`: with only the
      # `org.jetbrains.kotlin*` pattern the job logged "Skipping update group for 'kotlin'" and opened three
      # separate PRs for one Kotlin release (#30, #31, #33, 2026-10-12).
      kotlin:
        patterns:
          - "jvm"
          - "plugin.spring"
          - "plugin.jpa"
          - "org.jetbrains.kotlin*"
      spring:
        patterns:
          - "org.springframework*"
      test-libraries:
        patterns:
          - "io.kotest*"
          - "io.mockk*"
          - "com.ninja-squad*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore :"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/application"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore :"
    ignore:
      # The runtime image must stay on the Java 25 line the Gradle toolchain compiles for. Without this,
      # a `@dependabot rebase` re-resolved a 25.0.4.1 bump to 27_35 and it was merged by mistake (#23, 2026-10-06).
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/application/src/main/resources/cdc/docker-compose"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore :"
